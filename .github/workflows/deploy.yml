name: Deploy via SFTP

on:
  push:
    branches: [ "master" ]   # or remove this block to run on every branch
  workflow_dispatch:

permissions:
  contents: read  # recommended for actions/checkout

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }} # or use ssh_private_key instead
          port: 22
          local_path: "./*"                      # upload repo contents (non-dotfiles)
          remote_path: ${{ secrets.SFTP_REMOTE_PATH }}
          sftp_only: false                       # let the action create remote dir if needed
          delete_remote_files: false
          # rsyncArgs: "--exclude=node_modules --exclude=.git --exclude=.github"  # optional
