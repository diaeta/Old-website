name: Deploy to Combell via SSH (rsync)
on:
  push:
    branches: [ "master" ]  # change if your default branch differs

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Write SSH key from base64
        env:
          KEY_B64: ${{ secrets.COMBELL_SSH_KEY_B64 }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -lf ~/.ssh/id_ed25519  # sanity check

      - name: Trust host key
        env:
          SSH_HOST: ${{ secrets.COMBELL_SSH_HOST }}
        run: |
          ssh-keyscan -T 5 -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Smoke test SSH
        env:
          SSH_USER: ${{ secrets.COMBELL_SSH_USER }}
          SSH_HOST: ${{ secrets.COMBELL_SSH_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes $SSH_USER@$SSH_HOST "echo CONNECTED && pwd"

      - name: Deploy with rsync over SSH
        env:
          SSH_USER: ${{ secrets.COMBELL_SSH_USER }}
          SSH_HOST: ${{ secrets.COMBELL_SSH_HOST }}
        run: |
          # Sync and delete files that were removed from git
          rsync -azv \
            --delete \
            --delete-excluded \
            --exclude ".git*" \
            --exclude ".github/" \
            --exclude "node_modules/" \
            --exclude "mcp-servers/" \
            --exclude "scripts/" \
            --exclude ".byterover/" \
            --exclude ".claude/" \
            --exclude ".cursor/" \
            --exclude ".roo/" \
            --exclude ".vscode/" \
            --exclude "*.bak" \
            --exclude "*.backup" \
            --exclude "*.tmp" \
            --exclude ".DS_Store" \
            --exclude "Thumbs.db" \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            ./ $SSH_USER@$SSH_HOST:www/
