name: Deploy to Combell via SSH (rsync)
on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.COMBELL_SSH_KEY }}
          SSH_HOST: ${{ secrets.COMBELL_SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf "%s" "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Sync site (repo → ~/www/)
        env:
          SSH_USER: ${{ secrets.COMBELL_SSH_USER }}
          SSH_HOST: ${{ secrets.COMBELL_SSH_HOST }}
        run: |
          rsync -az --delete \
            --exclude ".git*" \
            --exclude ".github/" \
            --exclude "node_modules/" \
            ./ $SSH_USER@$SSH_HOST:~/www/
