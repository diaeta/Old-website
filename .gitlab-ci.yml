stages: [deploy]

concurrency:
  group: "deploy-production"
  cancel_pending: true

# Preview changes (manual dry run)
preflight_dry_run:
  stage: deploy
  image: alpine:3.20
  rules:
    - when: manual
      allow_failure: false
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - >/dev/null
    - mkdir -p ~/.ssh
    - |
      if [ -n "$SSH_KNOWN_HOSTS" ]; then
        echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      else
        ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts
      fi
    - chmod 700 ~/.ssh && chmod 644 ~/.ssh/known_hosts
  script:
    - RSYNC_SRC="./"   # local source in the repo/workspace (NOT the server folder)
    - echo "Dry-run from $RSYNC_SRC to ${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}"
    - rsync -az --delete --dry-run --itemize-changes \
        --exclude='.git/' --exclude='.gitlab/' --exclude='.github/' --exclude='node_modules/' \
        -e "ssh -p ${SSH_PORT:-22}" \
        "$RSYNC_SRC" "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}"

# Real deploy on main
deploy_production:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - >/dev/null
    - mkdir -p ~/.ssh
    - |
      if [ -n "$SSH_KNOWN_HOSTS" ]; then
        echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      else
        ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts
      fi
    - chmod 700 ~/.ssh && chmod 644 ~/.ssh/known_hosts
  script:
    - RSYNC_SRC="./"   # change to dist/ or public/ later if needed
    - echo "Deploying from $RSYNC_SRC to ${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}"
    - rsync -az --delete \
        --exclude='.git/' --exclude='.gitlab/' --exclude='.github/' --exclude='node_modules/' \
        -e "ssh -p ${SSH_PORT:-22}" \
        "$RSYNC_SRC" "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}"
